name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:      # reused by release.yml so a release cannot skip the tests

jobs:
  test:
    name: py${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - run: pytest -q

  no-runtime-dependencies:
    name: zero dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Install from the built wheel with no index available. If turnchunk ever
      # grows a runtime dependency, this step fails - which is the point.
      - run: pip install build && python -m build --wheel
      - run: pip install --no-index --no-deps dist/*.whl
      - run: |
          python -c "import turnchunk; print(turnchunk.__version__)"
          python -c "
          import importlib.metadata as md
          reqs = md.requires('turnchunk') or []
          runtime = [r for r in reqs if 'extra ==' not in r]
          assert not runtime, f'runtime dependencies appeared: {runtime}'
          print('confirmed: 0 runtime dependencies')
          "

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check src tests
