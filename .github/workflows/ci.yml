name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:      # reused by release.yml so a release cannot skip the tests

jobs:
  test:
    name: py${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - run: pytest -q

  no-runtime-dependencies:
    name: zero dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Install from the built wheel with no index available. If turnchunk ever
      # grows a runtime dependency, this step fails - which is the point.
      - run: pip install build && python -m build --wheel
      - run: pip install --no-index --no-deps dist/*.whl
      - run: |
          python -c "import turnchunk; print(turnchunk.__version__)"
          python -c "
          import importlib.metadata as md
          reqs = md.requires('turnchunk') or []
          runtime = [r for r in reqs if 'extra ==' not in r]
          assert not runtime, f'runtime dependencies appeared: {runtime}'
          print('confirmed: 0 runtime dependencies')
          "

  js:
    name: typescript (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["18", "20", "22"]
    defaults:
      run:
        working-directory: js
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm install
      - run: npx tsc --noEmit
      - run: npm run build
      # The conformance suite asserts the port is byte-identical to the Python
      # implementation against tests/corpus/conformance.json.
      - run: npm test

  corpus-is-current:
    name: corpus matches both implementations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      # Regenerating must be a no-op. A diff here means someone changed
      # behaviour without regenerating the corpus, so the two languages would
      # silently disagree.
      - run: python scripts/build_corpus.py
      - run: |
          if ! git diff --quiet tests/corpus/conformance.json; then
            echo "::error::conformance.json is stale - run python scripts/build_corpus.py"
            git diff --stat tests/corpus/conformance.json
            exit 1
          fi
          echo "corpus is current"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check src tests
