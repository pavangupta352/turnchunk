name: Release

# Publishes to PyPI on a version tag, using Trusted Publishing (OIDC).
# There is no API token stored anywhere - PyPI verifies the workflow identity.
#
# One-time setup at https://pypi.org/manage/account/publishing/
#   PyPI project name : turnchunk
#   Owner             : pavangupta352
#   Repository        : turnchunk
#   Workflow          : release.yml
# (Add it as a "pending publisher" before the first release, since the project
#  does not exist on PyPI yet.)
#
# Then:  git tag v0.1.0 && git push origin v0.1.0

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build
      - name: Check the tag matches the packaged version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(ls dist/*.whl | sed -E 's/.*turnchunk-([0-9.]+)-py3.*/\1/')
          echo "tag=$TAG package=$PKG"
          [ "$TAG" = "$PKG" ] || { echo "::error::tag $TAG != version $PKG"; exit 1; }
        if: startsWith(github.ref, 'refs/tags/v')
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish-pypi:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write        # required for Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  publish-npm:
    needs: build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: js
    permissions:
      id-token: write        # npm Trusted Publishing, same as PyPI: no token
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      # Node 22 ships npm 10.x, which has no OIDC support at all. Trusted
      # publishing needs npm >= 11.5.1, and without it the registry answers a
      # PUT with 404 rather than 401 -- so the failure looks like a missing
      # package instead of a failed login.
      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@latest
      - name: Show npm version
        run: npm --version
      # setup-node writes an _authToken line into .npmrc referencing
      # NODE_AUTH_TOKEN. With no token secret set that resolves to a
      # placeholder, and an invalid token beats OIDC. Drop it so npm falls
      # through to the trusted publisher.
      - name: Remove the placeholder auth token so OIDC is used
        run: |
          if [ -f "$NPM_CONFIG_USERCONFIG" ]; then
            sed -i '/_authToken/d' "$NPM_CONFIG_USERCONFIG"
            echo "cleaned $NPM_CONFIG_USERCONFIG"
          fi
      - run: npm install
      - run: npm run build
      - name: Check the tag matches package.json
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          echo "tag=$TAG package=$PKG"
          [ "$TAG" = "$PKG" ] || { echo "::error::tag $TAG != version $PKG"; exit 1; }
        if: startsWith(github.ref, 'refs/tags/v')
      # Skip cleanly if this version is already on npm. Makes the workflow
      # idempotent: a re-run, or a first release published by hand before
      # trusted publishing could be configured, does not fail the release.
      - name: Publish if this version is new
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "turnchunk@$VERSION" version >/dev/null 2>&1; then
            echo "::notice::turnchunk@$VERSION is already on npm, skipping"
            exit 0
          fi
          npm publish --provenance --access public

  github-release:
    needs: [publish-pypi, publish-npm]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
